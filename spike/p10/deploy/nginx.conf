# Local test deployment for spike P10. Start with:
#   nginx -p "$PWD" -c nginx.conf      (from spike/p10/deploy)
worker_processes 2;
error_log logs/error.log warn;
pid logs/nginx.pid;

events { worker_connections 1024; }

http {
    include /usr/local/etc/nginx/mime.types;
    # Stock mime.types (nginx >= 1.21) already maps `application/wasm wasm`;
    # on older nginx add it here as in the spike brief. .mjs must be JS.
    types {
        text/javascript mjs;
    }
    default_type application/octet-stream;
    access_log logs/access.log;
    sendfile on;

    ssl_certificate     certs/localhost.crt;
    ssl_certificate_key certs/localhost.key;
    ssl_protocols TLSv1.3;

    # 8443: Wasm build, COOP + COEP credentialless (the proposed config).
    server {
        listen 8443 ssl;
        http2 on;
        root www/wasm;
        include flutter-web.conf;
    }

    # 8444: JS build with the same headers, for the JS-vs-Wasm benchmarks.
    server {
        listen 8444 ssl;
        http2 on;
        root www/js;
        include flutter-web.conf;
    }

    # 8445: Wasm build WITHOUT isolation headers (single-threaded skwasm).
    server {
        listen 8445 ssl;
        http2 on;
        root www/wasm;
        gzip_static on;
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }

    # 8446: Wasm build with COEP require-corp, to compare with credentialless.
    server {
        listen 8446 ssl;
        http2 on;
        root www/wasm;
        gzip_static on;
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cache-Control "no-cache" always;
        }
    }
}
