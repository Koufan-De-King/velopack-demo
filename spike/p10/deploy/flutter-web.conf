# Headers and MIME types for a Flutter web build (JS or Wasm). Include this
# from a `server` block whose `root` is the build/web output.

location / {
    try_files $uri $uri/ /index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    # Flutter's file names are not content-hashed, so the browser must
    # revalidate everything (cheap 304s) instead of caching blindly.
    add_header Cache-Control "no-cache" always;
}

# Serve the precompressed .gz files produced by deploy.sh.
gzip_static on;
gzip_vary on;
